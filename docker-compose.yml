services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: the73
      POSTGRES_PASSWORD: the73_local_password
      POSTGRES_DB: the73change
    volumes:
      - the73-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U the73 -d the73change"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://the73:the73_local_password@postgres:5432/the73change?schema=public
      NEXTAUTH_URL: https://73.biubiuai.com.cn
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  the73-postgres:
