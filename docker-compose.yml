services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: the73
      POSTGRES_PASSWORD: the73_local_password
      POSTGRES_DB: the73change
    volumes:
      - the73-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U the73 -d the73change"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://the73:the73_local_password@postgres:5432/the73change?schema=public
      NEXTAUTH_URL: https://73.biubiuai.com.cn
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - the73-caddy-data:/data
      - the73-caddy-config:/config
    depends_on:
      - app

volumes:
  the73-postgres:
  the73-caddy-data:
  the73-caddy-config:
